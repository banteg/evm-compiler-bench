id: erc20_minimal
title: ERC20 Minimal
abi:
  - "totalSupply() returns (uint256)"
  - "balanceOf(address) returns (uint256)"
  - "allowance(address,address) returns (uint256)"
  - "transfer(address,uint256) returns (bool)"
  - "approve(address,uint256) returns (bool)"
  - "transferFrom(address,address,uint256) returns (bool)"
semantics:
  - "Initial supply is assigned to deployer."
  - "Transfers and transferFrom conserve total supply."
  - "Allowance decreases after transferFrom."
  - "Both implementations use checked arithmetic in transfer paths."
scenarios:
  - name: total_supply
    call: "totalSupply()"
    expected: "returns initial supply"
  - name: transfer_success
    call: "transfer(receiver, 10)"
    expected: "moves balance and emits Transfer"
  - name: approve_success
    call: "approve(spender, 7)"
    expected: "sets allowance and emits Approval"
  - name: transfer_from_success
    call: "transferFrom(owner, receiver, 5)"
    expected: "uses allowance and moves balance"
  - name: transfer_revert
    call: "transfer(receiver, 1) from empty account"
    expected: "reverts"
implementations:
  solidity: "benches/implementations/erc20_minimal/solidity/Erc20Minimal.sol"
  vyper: "benches/implementations/erc20_minimal/vyper/Erc20Minimal.vy"
  fe: "benches/implementations/erc20_minimal/fe/Erc20Minimal.fe"
