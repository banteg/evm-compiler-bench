  mock_assumptions:
    - benchmark harness deploys a standard ERC20 asset, two ERC4626-compatible strategies, deterministic and refund-mutating accountants, and limit modules
    - factory protocol fee config is provided by the harness and covers zero-fee and nonzero protocol-fee scenarios
    - accountant coverage uses deterministic and refund-mutating harness mocks; custom deposit/withdraw limit module coverage uses deterministic harness mocks
    - unrealized strategy-loss coverage uses a deterministic harness burn from strategy-held assets
    - Vyper String and DynArray decoder timing and exact revert bytes are intentionally out of scope when the accepted/rejected length boundary and post-state match
    - exact storage layout compatibility is intentionally out of scope for the idiomatic Solidity port because the benchmark claims externally observable vault behavior, not slot-level upgrade or proxy compatibility
    - Solidity port remains under full parity audit against the pinned Vyper source before production_equivalence can be set true
  included_features:
    - upstream Vyper vault source at the pinned commit
    - minimal-proxy deployment for the upstream Vyper blueprint
    - external ERC20 asset transfers for deposits, withdrawals, and strategy debt movement
    - role-gated strategy add, max debt, debt update, report, and shutdown paths
    - auto-allocation of deposits into the first default-queue strategy, including the minimum-idle-not-met short-circuit
    - Vyper default-argument external overloads for strategy, debt, deposit-limit, and queue-bound management
    - first-class measured management calls for max debt, additive roles, pending role-manager transfer, accountant, default-queue toggle, withdraw-limit module, and shutdown
    - strategy revoke with upstream default-queue order preservation, force revoke, minimum idle set/update-debt clipping, default queue, custom queue, and debt purchase surfaces
    - bitmask role mutation, Vyper enum role bounds, delegated role execution, and two-step role-manager transfer
    - mutable vault name and symbol metadata
    - Vyper-compatible String[64] name and String[32] symbol bounds
    - user withdraw and redeem max-loss upper-bound rejection
    - accountant, protocol-fee, deposit-limit-module, and withdraw-limit-module hooks, including module-call failure propagation
    - direct deposit-limit exact-limit boundary, deposit-limit module finite, exact-limit, zero-return maxDeposit/maxMint, active-module maxDeposit after existing vault assets, maxMint conversion after gains and partial profit unlock, and max-uint deposit/mint/max-view behavior, receiver-specific maxDeposit/maxMint returns including zero-return, receiver-specific deposit/mint execution, zero/vault-receiver short-circuit before module calls, plus deposit and mint over-limit rejection
    - withdraw-limit-module exact-limit withdraw acceptance, max-withdraw capping above and below balance, zero-return maxWithdraw/maxRedeem, non-1:1 partial-unlock maxRedeem conversion, owner-specific maxWithdraw/maxRedeem returns including zero-return, max-loss-specific and queue-specific maxWithdraw/maxRedeem returns, withdraw/redeem execution, finite and max-uint withdraw acceptance, module-call failure including zero-balance maxWithdraw/maxRedeem owner calls, and withdraw/redeem rejection paths
    - combined role, default-queue, debt, report, module, shutdown, withdrawal, and redeem sequence parity across six orderings, including active non-shutdown withdrawal and third-party-accountant/module edge sequences
    - profit/loss/zero report accounting, strategy zero report accounting with accountant fees/refunds, self-report no-op/gain/loss/refund accounting, self-report idle gain/loss with accountant fees/refunds and protocol-fee splits, self-report zero-effective clipped refund, refunds, gain plus clipped refund locking, gain reporting that moves current debt above max debt, refund clipping to partial and zero effective refunds, refund clipping after accountant state mutation on zero and gain reports, refund allowance reduction during zero and gain reports, fees, protocol-fee splits on gain and loss reports including loss reports with refunds, gain reports on the net-loss recalculation path, and simultaneous gain/loss reports, net-positive, exact-offset, and net-negative mixed loss/fee/refund reports for loss and gain paths, simultaneous strategy gain/loss reports with accountant effects, fee recalculation when fees exceed gains even after pulling refunds and on gain or loss reports when profit locking is disabled, locked-profit shares, partial-unlock profit and loss reports with accountant effects, cross-strategy loss reporting after another strategy's partially unlocked profit report, cross-strategy mixed reporting after partial unlock with mutating-accountant refunds and protocol-fee splitting, upstream excessive-fee underflow reverts, shared nonreentrant lock rejection, and unrealized-loss withdrawal/debt-update behavior
    - strategy maxDeposit limiting, minimum-idle clipping and no-available-idle early return, and zero-deposit debt update behavior
    - debt-decrease maxRedeem caps, shutdown pull-only, max-debt-below-current, and actual strategy redeem variance
    - strategy maxRedeem limiting, zero-redeem queue fallthrough, and withdrawable-asset capping
    - withdraw-limit module high-return withdraw and redeem execution plus capping through both maxWithdraw and maxRedeem, plus max-loss and strategy-queue argument forwarding across max views, withdraw execution, and redeem execution
    - partial and over-returning strategy redeem accounting during user withdrawals
    - buy-debt inactive-strategy rejection, zero-current-debt rejection, zero-amount rejection, current-debt clipping, and zero-share rejection
    - profit unlock reset while locked profit shares are outstanding
    - optional-return ERC20 asset handling
    - normalized event/log parity across the listed differential scenarios
    - deposit-limit and permission reverts
    - valid EIP-712 permit acceptance before and after initialization, after chain-id changes, plus expired-deadline and invalid-signature revert paths
  excluded_features:
    - exhaustive third-party accountant, limit-module, and strategy edge-case differential coverage beyond the covered deterministic and refund-mutating accountant paths
    - broader sequence-level parity coverage across other orderings of role, queue, debt, report, module, shutdown, withdrawal, and redeem flows
semantics:
  - "Benchmarks upstream Yearn V3 Vyper through its production blueprint/clone pattern against a Solidity port over the same asset and strategy harness."
  - "The Solidity port is expanded toward full upstream behavior, but production equivalence remains false until all management/module/queue paths are differentially covered and audited."
scenarios:
  - name: initialize
    call: "initialize(asset, name, symbol, roleManager, profitMaxUnlockTime)"
    expected: "sets asset, metadata, role manager, and profit unlock configuration"
  - name: deposit
    call: "deposit(100_000, address(this))"
    expected: "transfers assets in, mints shares, and increases idle assets"
  - name: deposit_asset_no_return
    call: "deposit(100_000, address(this)) with an asset transferFrom that returns no data"
    expected: "accepts the no-return ERC20 path through Vyper default_return_value=True semantics"
  - name: deposit_asset_false_return_reverts
    call: "deposit(100_000, address(this)) with an asset transferFrom that returns false"
    expected: "reverts at the optional-return transferFrom assertion"
  - name: deposit_all_max_uint
    call: "deposit(max_value(uint256), address(this))"
    expected: "deposits the sender's full asset balance through the upstream deposit-all branch"
  - name: mint
    call: "mint(50_000, address(this))"
    expected: "transfers required assets in and mints requested shares"
  - name: withdraw_idle
    call: "withdraw(20_000, address(this), address(this), 0)"
    expected: "burns shares and transfers idle assets"
  - name: withdraw_asset_no_return
    call: "withdraw(20_000, address(this), address(this), 0) with an asset transfer that returns no data"
    expected: "accepts the no-return ERC20 path through Vyper default_return_value=True semantics"
  - name: withdraw_asset_false_return_reverts
    call: "withdraw(20_000, address(this), address(this), 0) with an asset transfer that returns false"
    expected: "reverts at the optional-return transfer assertion"
  - name: withdraw_default_max_loss
    call: "withdraw(20_000, address(this), address(this)) using the Vyper default max_loss overload"
    expected: "burns shares and transfers idle assets with the upstream default max-loss selector"
  - name: withdraw_max_loss_too_high_reverts
    call: "withdraw(20_000, address(this), address(this), 10001)"
    expected: "reverts through the upstream max-loss basis-point bound"
  - name: redeem_idle
    call: "redeem(20_000, address(this), address(this), 0)"
    expected: "burns shares and returns proportional idle assets"
  - name: redeem_default_max_loss
    call: "redeem(20_000, address(this), address(this)) using the Vyper default max_loss overload"
    expected: "burns shares and returns proportional idle assets with the upstream default max-loss selector"
  - name: redeem_max_loss_too_high_reverts
    call: "redeem(20_000, address(this), address(this), 10001)"
