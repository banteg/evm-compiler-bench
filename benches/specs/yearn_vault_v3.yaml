real_derived:
  suite: real_derived
  model_kind: real_derived_model
  comparison_lane: production_conformance
  source_lane: latest_syntax_original
  counterpart_lane: fixture_scoped_port
  upstream_project: Yearn Vaults V3
  repository_url: "https://github.com/yearn/yearn-vaults-v3"
  source_commit: "104a2b233bc6d43ba40720d68355b04d2dc31795"
  source_path: "contracts/VaultV3.vy"
  source_language: vyper
  source_compiler: vyper
  source_profiles:
    - vyper-latest-gas
    - vyper-latest-none
    - vyper-0.3.7-default
    - vyper-0.3.7-none
  source_contract: VaultV3
  source_blob: "97f4a60dd2485c6400f994e46b442d0424716eed"
  upstream_license: GNU AGPLv3
  checked_at: "2026-05-24"
  production_equivalence: false
  api_compatibility: "source-language implementation is upstream Yearn Vault V3 behavior modernized to latest Vyper syntax and deployed through an EIP-1167 clone; Solidity is an expanded idiomatic port of the upstream vault API but still under parity audit"
  storage_layout_compatibility: false
  external_token_semantics: "harnessed_external_erc20_asset_and_erc4626_strategy"
  source_derivation: "Vyper implementation is a latest-syntax modernization of the pinned upstream source; Solidity implementation is an idiomatic port of the upstream vault behavior with management, module, queue, and strategy-accounting surfaces"
  equivalence_scope:
    - upstream Vyper blueprint plus minimal-proxy deployment model
    - ERC4626-style deposit, mint, withdraw, and redeem
    - deposit-all, max-uint, and zero-value ERC4626 conversion boundaries
    - ERC20 share approve, transfer, and transferFrom flows
    - role-gated strategy registry, max debt, and debt update paths
    - strategy revoke, force revoke, minimum-idle, and bad-debt purchase management
    - bitmask role grants, delegated role execution, and role-manager handoff
    - mutable ERC20 metadata through role-manager setters
    - accountant, deposit-limit module, and withdraw-limit module configuration surfaces
    - default and custom withdrawal queue configuration including the upstream MAX_QUEUE semantic bound
    - duplicate default-queue entries and full default-queue append-skip behavior
    - process_report using ERC4626-compatible strategy accounting plus accountant/protocol fee paths and upstream nonreentrant guard behavior
    - unrealized strategy-loss assessment, withdrawal max-loss enforcement, and debt-decrease rejection before a new report
    - locked-profit share accounting observable through pricePerShare
    - optional-return ERC20 asset transfer, transferFrom, and approve compatibility
    - EIP-712 permit acceptance and invalid-permit reverts
    - shutdown, deposit-limit, post-shutdown deposit-limit management, and permission reverts
    - inactive strategy management reverts and strategy re-addition after revoke or force-revoke
  scenario_coverage:
    - initialize
    - deposit
    - deposit_asset_no_return
    - deposit_asset_false_return_reverts
    - deposit_all_max_uint
    - mint
    - withdraw_idle
    - withdraw_default_max_loss
    - redeem_idle
    - approve
    - transfer
    - transfer_from
    - transfer_from_infinite_allowance
    - max_withdraw_default
    - max_redeem_default
    - conversion_zero_edges
    - max_mint_unlimited
    - update_debt_increase
    - update_debt_respects_minimum_idle
    - update_debt_decrease
    - update_max_debt_for_strategy
    - add_strategy_default_queue
    - revoke_strategy_preserves_queue_order
    - add_remove_role
    - role_manager_transfer_accept
    - set_metadata
    - set_accountant
    - set_auto_allocate
    - auto_allocate_deposit
    - set_minimum_total_idle
    - set_profit_max_unlock_time
    - strategy_profit_report
    - strategy_zero_report
    - strategy_report_with_accountant
    - strategy_loss_report
    - profit_unlock_after_time
    - strategy_loss_withdraw
    - assess_unrealized_loss
    - withdraw_limited_strategy_redeem
    - custom_queue_withdraw
    - set_default_queue
    - shutdown_rejects_deposit
    - shutdown_vault
    - permission_revert
    - set_deposit_limit_default
    - deposit_limit_module
    - withdraw_limit_module
    - permit_valid
    - permit_expired_reverts
    - permit_invalid_reverts
  mock_assumptions:
    - benchmark harness deploys a standard ERC20 asset, two ERC4626-compatible strategies, a deterministic accountant, and limit modules
    - factory protocol fee config is provided by the harness for the representative accountant/report scenarios
    - custom deposit and withdraw limit module coverage uses deterministic harness mocks
    - unrealized strategy-loss coverage uses a deterministic harness burn from strategy-held assets
    - Vyper String decoder timing, length caps, and exact revert bytes are intentionally out of scope for the idiomatic Solidity counterpart; queue length remains capped because it is vault behavior
    - exact storage layout compatibility is intentionally out of scope for the idiomatic Solidity port because the benchmark claims externally observable vault behavior, not slot-level upgrade or proxy compatibility
    - Solidity port remains under full parity audit against the pinned Vyper source before production_equivalence can be set true
  included_features:
    - upstream Vyper vault source at the pinned commit
    - minimal-proxy deployment for the upstream Vyper blueprint
    - representative ERC4626 deposit, deposit-all, mint, withdraw, redeem, share transfer, transferFrom, and allowance paths
    - optional-return ERC20 asset handling for the deposit hot path
    - role-gated strategy add, max debt, debt increase/decrease, revoke, report, and shutdown paths
    - auto-allocation of deposits into the first default-queue strategy
    - representative Vyper default-argument overloads for debt, withdrawal, and queue-bound calls
    - measured management calls for max debt, additive roles, pending role-manager transfer, accountant, metadata, minimum idle, profit unlock, default queue, deposit limit, withdraw limit, and shutdown
    - strategy revoke with upstream default-queue order preservation and a representative custom-queue withdrawal
    - bitmask role mutation and two-step role-manager transfer
    - mutable vault name and symbol metadata
    - representative accountant hook, strategy profit, strategy zero report, strategy loss report, locked-profit unlock, and unrealized-loss assessment
    - representative deposit-limit and withdraw-limit module execution paths
    - permission, post-shutdown deposit rejection, expired permit, and invalid permit reverts
    - normalized event/log parity across the listed differential scenarios
    - valid EIP-712 permit acceptance plus expired-deadline and invalid-signature revert paths
  excluded_features:
    - exhaustive third-party accountant, limit-module, strategy, and optional-return edge-case differential coverage beyond the representative common-usage paths
    - broader sequence-level parity coverage across other orderings of role, queue, debt, report, module, shutdown, withdrawal, and redeem flows
    - repeated ABI-bound and revert variants for every overloaded queue, module, and management function
semantics:
  - "Benchmarks upstream Yearn V3 Vyper through its production blueprint/clone pattern against a Solidity port over the same asset and strategy harness."
  - "The Solidity port is measured through common vault usage patterns; production equivalence remains false because long-tail management/module/queue permutations are intentionally excluded from the headline benchmark."
scenarios:
  - name: initialize
    call: "initialize(asset, name, symbol, roleManager, profitMaxUnlockTime)"
    expected: "sets asset, metadata, role manager, and profit unlock configuration"
  - name: deposit
    call: "deposit(100_000, address(this))"
    expected: "transfers assets in, mints shares, and increases idle assets"
  - name: deposit_asset_no_return
    call: "deposit(100_000, address(this)) with an asset transferFrom that returns no data"
    expected: "accepts the no-return ERC20 path through Vyper default_return_value=True semantics"
  - name: deposit_asset_false_return_reverts
    call: "deposit(100_000, address(this)) with an asset transferFrom that returns false"
    expected: "reverts at the optional-return transferFrom assertion"
  - name: deposit_all_max_uint
    call: "deposit(max_value(uint256), address(this))"
    expected: "deposits the sender's full asset balance through the upstream deposit-all branch"
  - name: mint
    call: "mint(50_000, address(this))"
    expected: "transfers required assets in and mints requested shares"
  - name: withdraw_idle
    call: "withdraw(20_000, address(this), address(this), 0)"
    expected: "burns shares and transfers idle assets"
  - name: withdraw_default_max_loss
    call: "withdraw(20_000, address(this), address(this)) using the Vyper default max_loss overload"
    expected: "burns shares and transfers idle assets with the upstream default max-loss selector"
  - name: redeem_idle
    call: "redeem(20_000, address(this), address(this), 0)"
    expected: "burns shares and returns proportional idle assets"
  - name: approve
    call: "approve(BOB, 123)"
    expected: "sets vault-share allowance"
  - name: transfer
    call: "transfer(BOB, 20_000) after deposit"
    expected: "moves vault shares between accounts"
  - name: transfer_from
    call: "transferFrom(address(this), BOB, 20_000) from an approved spender"
    expected: "moves vault shares and spends allowance"
  - name: transfer_from_infinite_allowance
    call: "transferFrom(address(this), BOB, 20_000) from an infinite-allowance spender"
    expected: "moves vault shares while leaving max_value(uint256) allowance untouched"
  - name: max_withdraw_default
    call: "maxWithdraw(address(this)) using the Vyper default max_loss overload"
    expected: "returns the default-loss withdrawable asset amount"
  - name: max_redeem_default
    call: "maxRedeem(address(this)) using the Vyper default max_loss overload"
    expected: "returns the default-loss redeemable share amount"
  - name: conversion_zero_edges
    call: "convertToShares(0) with zero-value preview/convert observers"
    expected: "returns zero through every upstream zero-value conversion early-return path"
  - name: max_mint_unlimited
    call: "maxMint(address(this)) with unlimited deposit limit"
    expected: "returns max_value(uint256) through the upstream unlimited-deposit conversion path"
  - name: update_debt_increase
    call: "update_debt(strategy, 100_000, 0)"
    expected: "moves idle assets into strategy debt"
  - name: update_debt_respects_minimum_idle
    call: "update_debt(strategy, 200_000, 0) after setting minimum_total_idle to 75_000"
    expected: "clips the debt increase to preserve the upstream minimum idle asset reserve"
  - name: update_debt_decrease
    call: "update_debt(strategy, 40_000, 0) after a higher debt allocation"
    expected: "redeems strategy shares and returns assets to idle"
  - name: update_max_debt_for_strategy
    call: "update_max_debt_for_strategy(strategy, 150_000)"
    expected: "updates the strategy max debt management parameter"
  - name: add_strategy_default_queue
    call: "add_strategy(strategy) using the Vyper default add_to_queue overload"
    expected: "adds the strategy and appends it to the default withdrawal queue"
  - name: revoke_strategy_preserves_queue_order
    call: "revoke_strategy(strategy) after three queued strategies"
    expected: "removes the revoked strategy without reordering surviving default queue entries"
  - name: add_remove_role
    call: "remove_role after set_role and add_role"
    expected: "updates the account role bitmask"
  - name: role_manager_transfer_accept
    call: "accept_role_manager after transfer_role_manager"
    expected: "moves role manager authority to the pending manager"
  - name: set_metadata
    call: "setSymbol after setName"
    expected: "updates mutable vault metadata through the role manager"
  - name: set_accountant
    call: "set_accountant(accountant)"
    expected: "updates the accountant address through the accountant manager role"
  - name: set_auto_allocate
    call: "set_auto_allocate(true)"
    expected: "updates the auto-allocation management flag"
  - name: auto_allocate_deposit
    call: "deposit(100_000, address(this)) with auto_allocate enabled and a default-queue strategy"
    expected: "mints shares and allocates newly idle assets into the first strategy"
  - name: set_minimum_total_idle
    call: "set_minimum_total_idle(10_000)"
    expected: "updates the minimum idle asset reserve"
  - name: set_profit_max_unlock_time
    call: "setProfitMaxUnlockTime(3_600)"
    expected: "updates future profit unlocking duration through the role manager"
  - name: strategy_profit_report
    call: "process_report after debt allocation and harnessed strategy profit"
    expected: "records gain, mints locked profit shares, and updates total assets"
  - name: strategy_zero_report
    call: "process_report after debt allocation with strategy assets equal to current debt"
    expected: "updates last report without gain, loss, fees, refunds, or profit locking"
  - name: strategy_report_with_accountant
    call: "process_report with accountant fees/refunds and nonzero protocol fee config"
    expected: "accounts fees, refunds, protocol fee shares, and locked profit"
  - name: strategy_loss_report
    call: "process_report with a strategy loss and no accountant fees or refunds"
    expected: "records the loss and reduces strategy debt without fee/refund accounting noise"
  - name: profit_unlock_after_time
    call: "pricePerShare after profit report and time advance"
    expected: "observes unlocked-profit share accounting"
  - name: strategy_loss_withdraw
    call: "withdraw through strategy queue with accepted loss"
    expected: "pulls from strategy debt and accounts loss"
  - name: assess_unrealized_loss
    call: "assess_share_of_unrealised_losses after burning strategy assets"
    expected: "returns the user's proportional unrealized loss share"
  - name: withdraw_limited_strategy_redeem
    call: "withdraw exactly the idle balance plus a capped strategy maxRedeem amount"
    expected: "pulls only the strategy-declared redeemable amount and records the partial debt decrease"
  - name: custom_queue_withdraw
    call: "withdraw with an explicit two-strategy custom queue"
    expected: "uses the supplied queue to free strategy debt"
  - name: set_default_queue
    call: "set_default_queue with the two strategies in reverse order"
    expected: "updates the stored default withdrawal queue"
  - name: shutdown_rejects_deposit
    call: "deposit after shutdown"
    expected: "reverts"
  - name: shutdown_vault
    call: "shutdown_vault() with an active deposit limit module"
    expected: "shuts down deposits, clears the deposit limit module, and emits shutdown state changes"
  - name: permission_revert
    call: "add_strategy from a non-manager sender"
    expected: "reverts"
  - name: set_deposit_limit_default
    call: "set_deposit_limit(limit) using the Vyper default override=false overload"
    expected: "updates the direct deposit limit when no module is active"
  - name: deposit_limit_module
    call: "deposit through a custom deposit limit module"
    expected: "uses the module-provided limit and accepts an in-limit deposit"
  - name: withdraw_limit_module
    call: "withdraw below a custom withdraw limit module limit"
    expected: "uses the module-provided limit and accepts an in-limit withdrawal"
  - name: permit_valid
    call: "permit with a harness-signed EIP-712 digest"
    expected: "sets allowance and increments the owner's nonce"
  - name: permit_expired_reverts
    call: "permit with a deadline before the current block timestamp"
    expected: "reverts before accepting the signature or changing nonce/allowance"
  - name: permit_invalid_reverts
    call: "permit with a zero signature"
    expected: "reverts"
implementations:
  solidity: "benches/implementations/yearn_vault_v3/solidity/YearnVaultV3Real.sol"
  vyper: "benches/implementations/yearn_vault_v3/vyper/latest/VaultV3.vy"
