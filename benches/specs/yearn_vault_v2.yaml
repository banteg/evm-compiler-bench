real_derived:
  suite: real_derived
  model_kind: real_derived_model
  comparison_lane: production_conformance
  source_lane: latest_syntax_original
  counterpart_lane: latest_idiomatic
  upstream_project: Yearn Vaults V2
  repository_url: "https://github.com/yearn/yearn-vaults"
  source_commit: "97ca1b2e4fcf20f4be0ff456dabd020bfeb6697b"
  source_path: "contracts/Vault.vy"
  source_language: vyper
  source_compiler: vyper
  source_contract: Vault
  source_blob: "1159912c093b12cf8d758f71d2d568cda69990af"
  upstream_license: GNU AGPLv3
  checked_at: "2026-05-27"
  production_equivalence: false
  api_compatibility: "Vyper implementation is the pinned Yearn V2 Vault source modernized to latest Vyper syntax; Solidity is an idiomatic port of the same vault API over the benchmark token and strategy fixtures"
  storage_layout_compatibility: false
  external_token_semantics: "harnessed_external_erc20_asset_and_strategy"
  source_derivation: "Vyper implementation is a latest-syntax modernization of the pinned upstream source; Solidity implementation ports the upstream vault behavior and management surface"
  equivalence_scope:
    - Yearn V2 monolithic vault initialization and ERC20 share behavior
    - deposit, deposit-all, withdraw, and idle/strategy withdrawal accounting
    - governance, management, guardian, deposit limit, emergency shutdown, and metadata management
    - strategy add, queue, debt ratio, credit, debt outstanding, revoke, and report flows
    - management, performance, and strategist fee share issuance
    - locked-profit degradation and price-per-share views
    - EIP-712 packed-signature permit
    - optional-return ERC20 transfer and transferFrom compatibility
  scenario_coverage:
    - initialize
    - initialize_long_metadata
    - permit_valid
    - permit_replay_reverts
    - set_deposit_limit
    - deposit
    - deposit_all
    - transfer
    - transfer_from
    - withdraw_idle
    - add_strategy
    - update_strategy_debt_ratio
    - report_credit
    - report_gain
    - withdraw_strategy
    - revoke_strategy
    - queue_add_remove
    - emergency_shutdown
    - set_name
    - set_symbol
    - set_governance
    - accept_governance
    - set_management
    - set_rewards
    - set_guardian
    - set_locked_profit_degradation
    - set_performance_fee
    - set_management_fee
    - set_withdrawal_queue
    - update_strategy_min_debt_per_harvest
    - update_strategy_max_debt_per_harvest
    - update_strategy_performance_fee
    - migrate_strategy
    - revoke_strategy_self
    - credit_available_self
    - debt_outstanding_self
    - expected_return_self
    - sweep_all
  mock_assumptions:
    - benchmark harness deploys a standard ERC20 asset and ERC20-like strategies with the Yearn V2 strategy view and withdrawal hooks
    - scenario coverage focuses on common governance, deposit, withdrawal, strategy, and report workflows, not adversarial branch coverage
    - exact storage layout compatibility is intentionally out of scope for the idiomatic Solidity port
  included_features:
    - pinned upstream Yearn V2 Vyper source
    - latest Vyper syntax modernization
    - full public vault ABI surface ported to Solidity
    - representative deposit, withdrawal, share transfer, strategy queue, debt accounting, report, and shutdown paths
    - representative governance handoff, metadata, fee, rewards, guardian, degradation, withdrawal-queue, strategy-parameter, migration, sweep, and msg.sender-default view updates
  excluded_features:
    - arbitrary strategy implementations beyond the deterministic benchmark fixture
    - exhaustive queue ordering and governance revert permutations
semantics:
  - "Benchmarks the Yearn V2 monolithic Vyper vault against a Solidity port over the same asset and strategy harness."
  - "The measured rows cover common vault usage patterns rather than adversarial branch coverage."
scenarios:
  - name: initialize
    call: "initialize(token, governance, rewards, name, symbol, guardian, management)"
    expected: "sets token, metadata, authority addresses, fees, and activation timestamps"
  - name: initialize_long_metadata
    call: "initialize with a multiword name and a 32-byte symbol"
    expected: "returns the complete overrides including the name's final partial word"
  - name: set_deposit_limit
    call: "setDepositLimit(limit)"
    expected: "accepts authorized deposit limit update"
  - name: deposit
    call: "deposit(amount, receiver)"
    expected: "transfers underlying and mints proportional shares"
  - name: deposit_all
    call: "deposit()"
    expected: "deposits up to the sender balance and deposit limit"
  - name: transfer
    call: "transfer(receiver, amount)"
    expected: "moves vault shares"
  - name: transfer_from
    call: "transferFrom(owner, receiver, amount)"
    expected: "moves approved vault shares and decreases allowance"
  - name: withdraw_idle
    call: "withdraw(shares, receiver, maxLoss)"
    expected: "burns shares and returns idle underlying"
  - name: add_strategy
    call: "addStrategy(strategy, debtRatio, minDebt, maxDebt, performanceFee)"
    expected: "registers strategy and appends it to the withdrawal queue"
  - name: update_strategy_debt_ratio
    call: "updateStrategyDebtRatio(strategy, debtRatio)"
    expected: "updates strategy and vault aggregate debt ratios"
  - name: report_credit
    call: "report(gain, loss, debtPayment)"
    expected: "strategy receives available credit"
  - name: report_gain
    call: "report(gain, loss, debtPayment)"
    expected: "accounts realized gain, fees, and locked profit"
  - name: withdraw_strategy
    call: "withdraw(shares, receiver, maxLoss)"
    expected: "pulls funds from queued strategy when idle assets are insufficient"
  - name: revoke_strategy
    call: "revokeStrategy(strategy)"
    expected: "sets strategy debt ratio to zero"
  - name: queue_add_remove
    call: "removeStrategyFromQueue(strategy)"
    expected: "removes strategy and compacts withdrawal queue"
  - name: emergency_shutdown
    call: "setEmergencyShutdown(true)"
    expected: "enables shutdown and zeros deposit/debt ratios"
  - name: permit_valid
    call: "permit with an independently signed EIP-712 digest and packed signature"
    expected: "sets the allowance from the independently signed permit"
  - name: permit_replay_reverts
    call: "repeat a permit signed with nonce zero after its successful use"
    expected: "rejects the consumed signature while preserving the allowance"
  - name: set_name
    call: "setName(name) from governance"
    expected: "replaces the share-token name"
  - name: set_symbol
    call: "setSymbol(symbol) from governance"
    expected: "replaces the share-token symbol"
  - name: set_governance
    call: "setGovernance(BOB) from governance"
    expected: "records the pending governance"
  - name: accept_governance
    call: "acceptGovernance() from the pending governance"
    expected: "hands governance to the pending address"
  - name: set_management
    call: "setManagement(BOB) from governance"
    expected: "updates management"
  - name: set_rewards
    call: "setRewards(BOB) from governance"
    expected: "updates the rewards recipient"
  - name: set_guardian
    call: "setGuardian(BOB) from the guardian"
    expected: "updates the guardian"
  - name: set_locked_profit_degradation
    call: "setLockedProfitDegradation(1e15) from governance"
    expected: "updates the locked-profit degradation rate"
  - name: set_performance_fee
    call: "setPerformanceFee(500) from governance"
    expected: "updates the vault performance fee"
  - name: set_management_fee
    call: "setManagementFee(500) from governance"
    expected: "updates the vault management fee"
  - name: set_withdrawal_queue
    call: "setWithdrawalQueue(queue) reversing two queued strategies"
    expected: "reorders the withdrawal queue"
  - name: update_strategy_min_debt_per_harvest
    call: "updateStrategyMinDebtPerHarvest(strategy, 10_000)"
    expected: "updates the strategy minimum debt per harvest"
  - name: update_strategy_max_debt_per_harvest
    call: "updateStrategyMaxDebtPerHarvest(strategy, 300_000)"
    expected: "updates the strategy maximum debt per harvest"
  - name: update_strategy_performance_fee
    call: "updateStrategyPerformanceFee(strategy, 500)"
    expected: "updates the strategy performance fee"
  - name: migrate_strategy
    call: "migrateStrategy(strategy, strategy3) after the strategy received credit"
    expected: "moves strategy parameters, debt, assets, and queue position to the new strategy"
  - name: revoke_strategy_self
    call: "revokeStrategy() from the strategy"
    expected: "sets the calling strategy debt ratio to zero"
  - name: credit_available_self
    call: "creditAvailable() from the strategy"
    expected: "quotes the calling strategy credit"
  - name: debt_outstanding_self
    call: "debtOutstanding() from the strategy after its debt ratio is lowered"
    expected: "quotes the calling strategy excess debt"
  - name: expected_return_self
    call: "expectedReturn() from the strategy after a reported gain and elapsed time"
    expected: "extrapolates the calling strategy return"
  - name: sweep_all
    call: "sweep(asset) after an airdrop"
    expected: "sends the vault asset surplus over totalIdle to governance"
implementations:
  solidity: "benches/implementations/yearn_vault_v2/solidity/YearnVaultV2Real.sol"
  vyper: "benches/implementations/yearn_vault_v2/vyper/latest/Vault.vy"
  fe: "benches/implementations/yearn_vault_v2/fe/YearnVaultV2Real.fe"
