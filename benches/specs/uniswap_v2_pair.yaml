id: uniswap_v2_pair
title: Real-Derived Uniswap V2 Pair Benchmark
abi:
  - "initialize(address,address)"
  - "mint(address) returns (uint256)"
  - "burn(address) returns (uint256,uint256)"
  - "swap(uint256,uint256,address,bytes)"
  - "skim(address)"
  - "sync()"
  - "approve(address,uint256) returns (bool)"
  - "transfer(address,uint256) returns (bool)"
  - "transferFrom(address,address,uint256) returns (bool)"
  - "permit(address,address,uint256,uint256,uint8,bytes32,bytes32)"
  - "name() returns (string)"
  - "symbol() returns (string)"
  - "decimals() returns (uint8)"
  - "getReserves() returns (uint112,uint112,uint32)"
  - "token0() returns (address)"
  - "token1() returns (address)"
  - "factory() returns (address)"
  - "balanceOf(address) returns (uint256)"
  - "allowance(address,address) returns (uint256)"
  - "nonces(address) returns (uint256)"
  - "DOMAIN_SEPARATOR() returns (bytes32)"
  - "PERMIT_TYPEHASH() returns (bytes32)"
  - "MINIMUM_LIQUIDITY() returns (uint256)"
  - "totalSupply() returns (uint256)"
  - "price0CumulativeLast() returns (uint256)"
  - "price1CumulativeLast() returns (uint256)"
  - "kLast() returns (uint256)"
real_derived:
  suite: real_derived
  model_kind: real_derived_model
  upstream_project: Uniswap V2 Core
  repository_url: "https://github.com/Uniswap/v2-core"
  source_commit: "6a9e7c97860676e0992f22a49665760444c1cdf5"
  source_path: "contracts/UniswapV2Pair.sol"
  source_language: solidity
  source_contract: UniswapV2Pair
  source_blob: "f87a1db262fba132862eae377d8cdaef74c79f97"
  upstream_license: GPL-3.0-or-later
  checked_at: "2026-05-24"
  production_equivalence: false
  api_compatibility: "source-language implementation is upstream Uniswap V2 Pair; Vyper is an idiomatic port of the covered pair API, not a full production-equivalent port"
  storage_layout_compatibility: false
  external_token_semantics: "harnessed_external_erc20_tokens_and_factory"
  source_derivation: "Solidity implementation is vendored upstream source; Vyper implementation is an idiomatic port for the covered pair paths"
  equivalence_scope:
    - external token0/token1/factory initialization
    - pair deployment through the factory CREATE2 path
    - reserve and getReserves accounting
    - mint, burn, swap, skim, and sync state transitions using external ERC20 balances
    - output transfers to ERC20 tokens that return either bool or no data
    - non-empty flash-swap callback execution and repayment
    - reentrancy lock rejection during flash-swap callbacks
    - constant-product fee check with 0.30% LP fee
    - fee-on protocol liquidity minting through kLast
    - cumulative price update behavior from elapsed block timestamp
    - ERC20 LP share accounting, metadata, allowance, and EIP-2612 permit
  scenario_coverage:
    - initialize
    - mint_initial
    - factory_create2_mint_initial
    - mint_subsequent
    - swap_fee_invariant
    - flash_swap_callback
    - flash_swap_large_callback_data
    - flash_swap_reentrancy_reverts
    - burn
    - burn_no_return_tokens
    - swap_no_return_tokens
    - sync
    - sync_timestamp_wrap
    - skim
    - skim_no_return_tokens
    - fee_on_mint
    - fee_off_resets_k_last
    - uninitialized_mint_reverts
    - reinitialize_by_factory
    - non_factory_initialize_reverts
    - invalid_swap_reverts
    - swap_to_token_reverts
    - permit_valid
    - permit_after_chain_id_change
    - permit_expired_reverts
    - permit_invalid_reverts
  mock_assumptions:
    - benchmark harness deploys standard ERC20 test tokens and provides the factory feeTo address
    - no-return ERC20 coverage uses harness tokens that update balances but return no transfer data
    - token transfers into the pair are staged with harness mints before measured calls
    - flash-swap callback repayment uses a deterministic harness callee
    - Vyper preserves behavior for covered paths but does not claim unbounded callback calldata
  included_features:
    - upstream Solidity pair source at the pinned commit
    - full upstream pair ABI surface including the MINIMUM_LIQUIDITY constant getter
    - pair creation through a benchmark factory using CREATE2 and factory-owned initialize
    - external ERC20 balance and transfer integration
    - optional-return ERC20 transfer compatibility
    - first and subsequent mint paths
    - burn path with staged LP shares
    - constant-product swap fee invariant
    - non-empty flash-swap callback execution
    - flash-swap callback data above the old 1024-byte Vyper port bound
    - flash-swap reentrancy guard rejection
    - sync and skim balance drift paths
    - uint32 reserve timestamp wraparound and cumulative price wraparound semantics
    - packed reserve0/reserve1/blockTimestampLast storage word using the upstream bit layout
    - no-return token swap, burn, and skim transfer-out paths
    - fee-on and fee-off kLast behavior
    - LP token metadata, allowance, and EIP-712 permit acceptance, chain-id drift, expired-deadline rejection, and invalid-signature rejection
    - normalized event/log parity across the listed differential scenarios
  excluded_features:
    - truly unbounded flash-swap callback calldata length in the Vyper port
    - full upstream UniswapV2Factory behavior beyond pair initialize, feeTo, and benchmark CREATE2 deployment
    - exhaustive revert-data and ABI-boundary parity audit outside the listed scenarios
semantics:
  - "Benchmarks upstream Uniswap V2 Pair Solidity and a scoped Vyper port against the same external-token harness."
  - "The scenarios cover factory CREATE2 pair deployment plus pair reserve, LP share, swap invariant, fee-on, cumulative price, sync, and skim hot paths."
scenarios:
  - name: initialize
    call: "initialize(token0, token1)"
    expected: "sets token addresses through the production initialization API"
  - name: mint_initial
    call: "mint(address(this)) after token balances are sent to the pair"
    expected: "mints LP supply minus permanent minimum liquidity"
  - name: factory_create2_mint_initial
    call: "mint(address(this)) after the pair is created by a factory CREATE2 deployment"
    expected: "factory deploys and initializes the pair before the initial mint path"
  - name: mint_subsequent
    call: "mint(address(this)) after an existing position and additional token balances"
    expected: "mints proportional LP shares"
  - name: swap_fee_invariant
    call: "swap(0, 100, address(this), empty bytes) after token input is sent to the pair"
    expected: "updates balances and reserves while preserving the adjusted constant-product invariant"
  - name: flash_swap_callback
    call: "swap(0, 100, flash callee, non-empty callback data)"
    expected: "optimistically transfers output, invokes the callback, accepts repayment, and updates reserves"
  - name: flash_swap_large_callback_data
    call: "swap(0, 100, flash callee, callback data larger than 1024 bytes)"
    expected: "accepts and forwards callback data above the previous Vyper port bound"
  - name: flash_swap_reentrancy_reverts
    call: "swap(0, 100, reentrant flash callee, non-empty callback data)"
    expected: "rejects reentrant pair calls from the callback through the production lock"
  - name: burn
    call: "burn(address(this)) after LP shares are transferred to the pair"
    expected: "burns staged LP and transfers proportional token balances out"
  - name: burn_no_return_tokens
    call: "burn(address(this)) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data and burns staged LP"
  - name: swap_no_return_tokens
    call: "swap(0, 100, address(this), empty bytes) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data on the output token and updates reserves"
  - name: sync
    call: "sync() after token balance drift and time advance"
    expected: "updates reserves and cumulative prices from external token balances"
  - name: sync_timestamp_wrap
    call: "sync() after block.timestamp crosses the uint32 reserve timestamp boundary"
    expected: "updates reserves and cumulative prices using Uniswap's intended uint32 wraparound elapsed time"
  - name: skim
    call: "skim(address(this)) after token balance drift"
    expected: "transfers token balances above reserves"
  - name: skim_no_return_tokens
    call: "skim(address(this)) after token balance drift with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data while skimming balances above reserves"
  - name: fee_on_mint
    call: "feeTo set, mint, sync, mint"
    expected: "updates kLast and mints protocol liquidity when rootK grows"
  - name: fee_off_resets_k_last
    call: "feeTo cleared after fee-on liquidity"
    expected: "resets kLast"
  - name: uninitialized_mint_reverts
    call: "mint(address(this)) before initialize"
    expected: "reverts"
  - name: reinitialize_by_factory
    call: "initialize(token0, token1) from the factory after an initial initialize"
    expected: "resets token addresses, matching the upstream pair's factory-only initialization gate"
  - name: non_factory_initialize_reverts
    call: "initialize(token0, token1) from a non-factory address"
    expected: "reverts"
  - name: invalid_swap_reverts
    call: "swap with zero input"
    expected: "reverts"
  - name: swap_to_token_reverts
    call: "swap output to token0 address"
    expected: "reverts"
  - name: permit_valid
    call: "permit with a harness-signed EIP-712 digest"
    expected: "sets allowance and increments the owner's nonce"
  - name: permit_after_chain_id_change
    call: "permit with a harness-signed EIP-712 digest after block.chainid changes"
    expected: "uses the constructor-time domain separator and accepts the permit"
  - name: permit_expired_reverts
    call: "permit with a deadline before the current block timestamp"
    expected: "reverts before accepting the signature or changing nonce/allowance"
  - name: permit_invalid_reverts
    call: "permit with a zero signature"
    expected: "reverts"
implementations:
  solidity: "benches/implementations/uniswap_v2_pair/solidity/upstream/contracts/UniswapV2Pair.sol"
  vyper: "benches/implementations/uniswap_v2_pair/vyper/UniswapV2PairReal.vy"
