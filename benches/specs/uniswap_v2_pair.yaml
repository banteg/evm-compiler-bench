id: uniswap_v2_pair
title: Real-Derived Uniswap V2 Pair Benchmark
abi:
  - "initialize(address,address)"
  - "mint(address) returns (uint256)"
  - "burn(address) returns (uint256,uint256)"
  - "swap(uint256,uint256,address,bytes)"
  - "skim(address)"
  - "sync()"
  - "approve(address,uint256) returns (bool)"
  - "transfer(address,uint256) returns (bool)"
  - "transferFrom(address,address,uint256) returns (bool)"
  - "permit(address,address,uint256,uint256,uint8,bytes32,bytes32)"
  - "name() returns (string)"
  - "symbol() returns (string)"
  - "decimals() returns (uint8)"
  - "getReserves() returns (uint112,uint112,uint32)"
  - "token0() returns (address)"
  - "token1() returns (address)"
  - "factory() returns (address)"
  - "balanceOf(address) returns (uint256)"
  - "allowance(address,address) returns (uint256)"
  - "nonces(address) returns (uint256)"
  - "DOMAIN_SEPARATOR() returns (bytes32)"
  - "PERMIT_TYPEHASH() returns (bytes32)"
  - "MINIMUM_LIQUIDITY() returns (uint256)"
  - "totalSupply() returns (uint256)"
  - "price0CumulativeLast() returns (uint256)"
  - "price1CumulativeLast() returns (uint256)"
  - "kLast() returns (uint256)"
real_derived:
  suite: real_derived
  model_kind: real_derived_model
  comparison_lane: fixture_scoped_port
  upstream_project: Uniswap V2 Core
  repository_url: "https://github.com/Uniswap/v2-core"
  source_commit: "6a9e7c97860676e0992f22a49665760444c1cdf5"
  source_path: "contracts/UniswapV2Pair.sol"
  source_language: solidity
  source_compiler: solc-0.5.16
  source_profiles:
    - solc-0.5.16-legacy-runs200
    - solc-0.5.16-noopt
  source_contract: UniswapV2Pair
  source_blob: "f87a1db262fba132862eae377d8cdaef74c79f97"
  upstream_license: GPL-3.0-or-later
  checked_at: "2026-05-24"
  production_equivalence: false
  api_compatibility: "source-language implementation is upstream Uniswap V2 Pair; Vyper is an idiomatic port of the covered pair API, not a full production-equivalent port"
  storage_layout_compatibility: false
  external_token_semantics: "harnessed_external_erc20_tokens_and_factory"
  source_derivation: "Solidity implementation is vendored upstream source; Vyper implementation is an idiomatic port for the covered pair paths"
  equivalence_scope:
    - external token0/token1/factory initialization
    - pair deployment through the factory CREATE2 path
    - reserve and getReserves accounting
    - mint, burn, swap, skim, and sync state transitions using external ERC20 balances
    - output transfers to ERC20 tokens that return true, false, or no data
    - non-empty flash-swap callback execution and repayment
    - reentrancy lock rejection during flash-swap callbacks
    - constant-product fee check with 0.30% LP fee
    - fee-on protocol liquidity minting through kLast
    - cumulative price update behavior from elapsed block timestamp
    - ERC20 LP share accounting, metadata, allowance, and EIP-2612 permit
  scenario_coverage:
    - initialize
    - factory_getter
    - mint_initial
    - mint_initial_below_minimum_liquidity_reverts
    - factory_create2_mint_initial
    - factory_create2_state
    - factory_set_fee_to
    - factory_set_fee_to_forbidden_reverts
    - factory_set_fee_to_setter
    - factory_set_fee_to_setter_forbidden_reverts
    - factory_duplicate_pair_reverts
    - factory_identical_pair_reverts
    - factory_zero_address_pair_reverts
    - mint_subsequent
    - mint_zero_receiver
    - swap_fee_invariant
    - swap_dual_output
    - swap_token0_input
    - swap_token0_input_k_reverts
    - swap_token1_input
    - swap_token1_input_k_reverts
    - swap_zero_output_reverts
    - swap_insufficient_liquidity_reverts
    - flash_swap_callback
    - flash_swap_large_callback_data
    - flash_swap_8k_callback_data
    - flash_swap_64k_callback_data
    - flash_swap_reentrancy_reverts
    - burn
    - burn_zero_receiver
    - burn_without_staged_liquidity_reverts
    - burn_no_return_tokens
    - burn_false_return_token_reverts
    - swap_no_return_tokens
    - swap_false_return_token_reverts
    - sync
    - sync_timestamp_wrap
    - sync_reserve_overflow_reverts
    - skim
    - skim_zero_receiver
    - skim_no_return_tokens
    - skim_false_return_token_reverts
    - fee_on_mint
    - fee_off_resets_k_last
    - lp_transfer
    - lp_transfer_insufficient_balance_reverts
    - lp_transfer_zero_receiver
    - lp_approve
    - lp_transfer_from_finite_allowance
    - lp_transfer_from_insufficient_allowance_reverts
    - lp_transfer_from_zero_receiver
    - lp_transfer_from_infinite_allowance
    - uninitialized_mint_reverts
    - reinitialize_by_factory
    - non_factory_initialize_reverts
    - invalid_swap_reverts
    - swap_to_token_reverts
    - swap_to_token1_reverts
    - unknown_selector_reverts
    - mint_truncated_calldata_reverts
    - swap_truncated_dynamic_tail_reverts
    - permit_truncated_calldata_reverts
    - permit_valid
    - permit_after_chain_id_change
    - permit_expired_reverts
    - permit_invalid_reverts
  mock_assumptions:
    - benchmark harness deploys standard ERC20 test tokens and uses a bytecode-injected factory helper that mirrors upstream pair creation state
    - no-return ERC20 coverage uses harness tokens that update balances but return no transfer data
    - false-return ERC20 coverage uses harness tokens that update balances but explicitly return false
    - token transfers into the pair are staged with harness mints before measured calls
    - flash-swap callback repayment uses a deterministic harness callee
    - Vyper preserves callback behavior through its idiomatic 65536-byte source bound; that bound is treated as an accepted language-level semantic boundary
    - exact storage layout compatibility is intentionally out of scope for the idiomatic Vyper port because the benchmark claims externally observable pair behavior; the upstream packed reserve word is preserved where pair behavior depends on uint112/uint32 reserve semantics
  included_features:
    - upstream Solidity pair source at the pinned commit
    - full upstream pair ABI surface including token0, token1, factory, DOMAIN_SEPARATOR, PERMIT_TYPEHASH, and MINIMUM_LIQUIDITY getters
    - pair creation through a benchmark factory using CREATE2, upstream token sorting and duplicate guards, bidirectional getPair storage, allPairs tracking, factory-owned initialize, and feeTo/feeToSetter authorization guards
    - external ERC20 balance and transfer integration
    - optional-return ERC20 transfer compatibility
    - first and subsequent mint paths, including initial mint rejection below MINIMUM_LIQUIDITY and upstream zero-recipient LP mint behavior
    - burn path with staged LP shares, zero-recipient burn transfers, and no-staged-liquidity rejection
    - constant-product swap fee invariant for both token0-input and token1-input paths, including dual-output swaps, upstream exact-price fixtures, and one-wei-over K rejections
    - production swap guard rejection for zero-output, insufficient-liquidity, and one-wei over-output swaps
    - non-empty flash-swap callback execution
    - flash-swap callback data above the old 1024-byte and 4096-byte Vyper port bounds, plus the current 65536-byte port boundary
    - flash-swap reentrancy guard rejection
    - sync and skim balance drift paths, including zero-recipient skim transfers
    - upstream uint112 reserve overflow rejection
    - uint32 reserve timestamp wraparound and cumulative price wraparound semantics
    - packed reserve0/reserve1/blockTimestampLast storage word using the upstream bit layout
    - no-return token swap, burn, and skim transfer-out paths
    - false-return token swap, burn, and skim transfer-out rejection
    - fee-on and fee-off kLast behavior
    - LP token metadata, balances, direct transfers including upstream zero-recipient transfers, insufficient-balance transfer rejection, approvals, finite/infinite/insufficient allowance transferFrom, zero-recipient transferFrom behavior, and EIP-712 permit acceptance, chain-id drift, expired-deadline rejection, and invalid-signature rejection
    - ABI boundary rejection for unknown selectors, truncated fixed-argument calldata, malformed dynamic calldata tails, and truncated permit payloads
    - normalized event/log parity across the listed differential scenarios
  excluded_features:
    - upstream UniswapV2Factory createPair ABI is represented by a bytecode-injected deployPair harness hook so both language artifacts can be deployed through the same CREATE2 path
    - exhaustive factory-management scenarios beyond feeTo, feeToSetter authorization, pair mapping, allPairs tracking, pair creation, and invalid-pair guards are not yet covered
    - exhaustive revert-data parity and ABI-boundary audit outside the listed malformed calldata scenarios
semantics:
  - "Benchmarks upstream Uniswap V2 Pair Solidity and a scoped Vyper port against the same external-token harness."
  - "The scenarios cover factory CREATE2 pair deployment plus pair reserve, LP share, swap invariant, fee-on, cumulative price, sync, and skim hot paths."
scenarios:
  - name: initialize
    call: "initialize(token0, token1)"
    expected: "sets token addresses through the production initialization API"
  - name: factory_getter
    call: "factory() after initialization, with normalized token0/token1 and DOMAIN_SEPARATOR observers"
    expected: "returns the deployer/factory address and proves initialized token getters plus constructor-time EIP-712 domain separator"
  - name: mint_initial
    call: "mint(address(this)) after token balances are sent to the pair"
    expected: "mints LP supply minus permanent minimum liquidity"
  - name: mint_initial_below_minimum_liquidity_reverts
    call: "mint(address(this)) after token balances below MINIMUM_LIQUIDITY are sent to the pair"
    expected: "reverts through the upstream initial-liquidity underflow guard"
  - name: factory_create2_mint_initial
    call: "mint(address(this)) after the pair is created by a factory CREATE2 deployment"
    expected: "factory deploys and initializes the pair before the initial mint path"
  - name: factory_create2_state
    call: "factory fixture state after CREATE2 pair deployment"
    expected: "records feeToSetter, allPairs, and bidirectional getPair mappings for the deployed pair"
  - name: factory_set_fee_to
    call: "factory setFeeTo from feeToSetter"
    expected: "accepts the authorized fee recipient update"
  - name: factory_set_fee_to_forbidden_reverts
    call: "factory setFeeTo from a non-feeToSetter sender"
    expected: "reverts through the upstream FORBIDDEN guard"
  - name: factory_set_fee_to_setter
    call: "factory setFeeToSetter from feeToSetter"
    expected: "accepts the authorized feeToSetter transfer"
  - name: factory_set_fee_to_setter_forbidden_reverts
    call: "factory setFeeToSetter from a non-feeToSetter sender"
    expected: "reverts through the upstream FORBIDDEN guard"
  - name: factory_duplicate_pair_reverts
    call: "factory deployPair with an existing token pair"
    expected: "reverts through the upstream PAIR_EXISTS guard"
  - name: factory_identical_pair_reverts
    call: "factory deployPair with identical token addresses"
    expected: "reverts through the upstream IDENTICAL_ADDRESSES guard"
  - name: factory_zero_address_pair_reverts
    call: "factory deployPair with a zero token address"
    expected: "reverts through the upstream ZERO_ADDRESS guard"
  - name: mint_subsequent
    call: "mint(address(this)) after an existing position and additional token balances"
    expected: "mints proportional LP shares"
  - name: mint_zero_receiver
    call: "mint(address(0)) after an existing position and additional token balances"
    expected: "mints proportional LP shares to the zero address because upstream Uniswap V2 ERC20 has no zero-recipient mint guard"
  - name: swap_fee_invariant
    call: "swap(0, 100, address(this), empty bytes) after token input is sent to the pair"
    expected: "updates balances and reserves while preserving the adjusted constant-product invariant"
  - name: swap_dual_output
    call: "swap(100, 100, address(this), empty bytes) after token0 input is sent to the pair"
    expected: "permits simultaneous token0 and token1 output when the adjusted constant-product invariant is satisfied"
  - name: swap_token0_input
    call: "swap(0, 1662497915624478906, address(this), empty bytes) after token0 input is sent to the pair"
    expected: "matches the upstream token0-input swap fixture and updates reserves while preserving the adjusted invariant"
  - name: swap_token0_input_k_reverts
    call: "swap(0, 1662497915624478907, address(this), empty bytes) after token0 input is sent to the pair"
    expected: "rejects the upstream over-output case through the production K-invariant check"
  - name: swap_token1_input
    call: "swap(453305446940074565, 0, address(this), empty bytes) after token1 input is sent to the pair"
    expected: "matches the upstream token1-input swap fixture and updates reserves while preserving the adjusted invariant"
  - name: swap_token1_input_k_reverts
    call: "swap(453305446940074566, 0, address(this), empty bytes) after token1 input is sent to the pair"
    expected: "rejects the upstream over-output case through the production K-invariant check"
  - name: swap_zero_output_reverts
    call: "swap(0, 0, address(this), empty bytes) after initialized liquidity"
    expected: "reverts through the upstream insufficient-output guard"
  - name: swap_insufficient_liquidity_reverts
    call: "swap(0, reserve1, address(this), empty bytes) after initialized liquidity"
    expected: "reverts through the upstream insufficient-liquidity guard"
  - name: flash_swap_callback
    call: "swap(0, 100, flash callee, non-empty callback data)"
    expected: "optimistically transfers output, invokes the callback, accepts repayment, and updates reserves"
  - name: flash_swap_large_callback_data
    call: "swap(0, 100, flash callee, callback data larger than 1024 bytes)"
    expected: "accepts and forwards callback data above the previous Vyper port bound"
  - name: flash_swap_8k_callback_data
    call: "swap(0, 100, flash callee, callback data larger than 4096 bytes)"
    expected: "executes the callback and repays through the widened Vyper callback-data bound"
  - name: flash_swap_64k_callback_data
    call: "swap(0, 100, flash callee, callback data exactly at the Vyper port's 65536-byte bound)"
    expected: "executes the callback and repays at the largest callback-data payload accepted by the Vyper port"
  - name: flash_swap_reentrancy_reverts
    call: "swap(0, 100, reentrant flash callee, non-empty callback data)"
    expected: "rejects reentrant pair calls from the callback through the production lock"
  - name: burn
    call: "burn(address(this)) after LP shares are transferred to the pair"
    expected: "burns staged LP and transfers proportional token balances out"
  - name: burn_zero_receiver
    call: "burn(address(0)) after LP shares are transferred to the pair"
    expected: "burns staged LP and transfers proportional token balances to the zero address because the upstream pair has no zero-recipient burn guard"
  - name: burn_without_staged_liquidity_reverts
    call: "burn(address(this)) after pool initialization without transferring LP shares to the pair"
    expected: "reverts through the upstream insufficient-liquidity-burned guard"
  - name: burn_no_return_tokens
    call: "burn(address(this)) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data and burns staged LP"
  - name: burn_false_return_token_reverts
    call: "burn(address(this)) with an output token that returns false from transfer"
    expected: "reverts through the upstream safe-transfer false-return guard"
  - name: swap_no_return_tokens
    call: "swap(0, 100, address(this), empty bytes) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data on the output token and updates reserves"
  - name: swap_false_return_token_reverts
    call: "swap(0, 100, address(this), empty bytes) with an output token that returns false from transfer"
    expected: "reverts through the upstream safe-transfer false-return guard"
  - name: sync
    call: "sync() after token balance drift and time advance"
    expected: "updates reserves and cumulative prices from external token balances"
  - name: sync_timestamp_wrap
    call: "sync() after block.timestamp crosses the uint32 reserve timestamp boundary"
    expected: "updates reserves and cumulative prices using Uniswap's intended uint32 wraparound elapsed time"
  - name: sync_reserve_overflow_reverts
    call: "sync() after token0 balance exceeds uint112 max"
    expected: "reverts through the upstream reserve overflow guard"
  - name: skim
    call: "skim(address(this)) after token balance drift"
    expected: "transfers token balances above reserves"
  - name: skim_zero_receiver
    call: "skim(address(0)) after token balance drift"
    expected: "transfers token balances above reserves to the zero address because the upstream pair has no zero-recipient skim guard"
  - name: skim_no_return_tokens
    call: "skim(address(this)) after token balance drift with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data while skimming balances above reserves"
  - name: skim_false_return_token_reverts
    call: "skim(address(this)) after token balance drift with an output token that returns false from transfer"
    expected: "reverts through the upstream safe-transfer false-return guard"
  - name: fee_on_mint
    call: "feeTo set, mint, sync, mint"
    expected: "updates kLast and mints protocol liquidity when rootK grows"
  - name: fee_off_resets_k_last
    call: "feeTo cleared after fee-on liquidity"
    expected: "resets kLast"
  - name: lp_transfer
    call: "transfer LP shares to another account"
    expected: "moves LP share balance and emits a normalized transfer log"
  - name: lp_transfer_insufficient_balance_reverts
    call: "transfer LP shares without a sufficient sender balance"
    expected: "reverts through the upstream ERC20 balance check"
  - name: lp_transfer_zero_receiver
    call: "transfer LP shares to the zero address"
    expected: "moves LP shares to the zero address because upstream Uniswap V2 ERC20 has no zero-recipient guard"
  - name: lp_approve
    call: "approve another account to spend LP shares"
    expected: "sets allowance and emits a normalized approval log"
  - name: lp_transfer_from_finite_allowance
    call: "transferFrom LP shares through a finite allowance"
    expected: "moves LP shares and decreases the allowance by the spent amount"
  - name: lp_transfer_from_insufficient_allowance_reverts
    call: "transferFrom LP shares above the approved finite allowance"
    expected: "reverts through the upstream ERC20 allowance check"
  - name: lp_transfer_from_zero_receiver
    call: "transferFrom LP shares to the zero address through a finite allowance"
    expected: "moves LP shares to the zero address and spends allowance because upstream Uniswap V2 ERC20 has no zero-recipient guard"
  - name: lp_transfer_from_infinite_allowance
    call: "transferFrom LP shares through a max uint256 allowance"
    expected: "moves LP shares without decreasing the allowance"
  - name: uninitialized_mint_reverts
    call: "mint(address(this)) before initialize"
    expected: "reverts"
  - name: reinitialize_by_factory
    call: "initialize(token0, token1) from the factory after an initial initialize"
    expected: "resets token addresses, matching the upstream pair's factory-only initialization gate"
  - name: non_factory_initialize_reverts
    call: "initialize(token0, token1) from a non-factory address"
    expected: "reverts"
  - name: invalid_swap_reverts
    call: "swap with zero input"
    expected: "reverts"
  - name: swap_to_token_reverts
    call: "swap output to token0 address"
    expected: "reverts"
  - name: swap_to_token1_reverts
    call: "swap output to token1 address"
    expected: "reverts through the symmetric upstream INVALID_TO guard"
  - name: unknown_selector_reverts
    call: "raw call with an unknown selector"
    expected: "reverts through the absence of a fallback entry point"
  - name: mint_truncated_calldata_reverts
    call: "raw mint(address) selector with a short address word"
    expected: "reverts before mint state changes at the ABI boundary"
  - name: swap_truncated_dynamic_tail_reverts
    call: "raw swap(uint256,uint256,address,bytes) calldata whose bytes tail offset has no length word"
    expected: "reverts before swap state changes at the ABI boundary"
  - name: permit_truncated_calldata_reverts
    call: "raw permit calldata with only the first three encoded arguments"
    expected: "reverts before accepting the signature or changing nonce/allowance"
  - name: permit_valid
    call: "permit with a harness-signed EIP-712 digest"
    expected: "sets allowance and increments the owner's nonce"
  - name: permit_after_chain_id_change
    call: "permit with a harness-signed EIP-712 digest after block.chainid changes"
    expected: "uses the constructor-time domain separator and accepts the permit"
  - name: permit_expired_reverts
    call: "permit with a deadline before the current block timestamp"
    expected: "reverts before accepting the signature or changing nonce/allowance"
  - name: permit_invalid_reverts
    call: "permit with a zero signature"
    expected: "reverts"
implementations:
  solidity: "benches/implementations/uniswap_v2_pair/solidity/upstream/contracts/UniswapV2Pair.sol"
  vyper: "benches/implementations/uniswap_v2_pair/vyper/UniswapV2PairReal.vy"
