real_derived:
  suite: real_derived
  model_kind: real_derived_model
  upstream_project: Curve Stableswap NG
  repository_url: "https://github.com/curvefi/stableswap-ng"
  source_commit: "2abe778f40206a6c0fd108a0a53ad3266cbedeee"
  source_path: "contracts/main/CurveStableSwapNG.vy"
  source_language: vyper
  source_contract: CurveStableSwapNG
  source_blob: "f192932a22958735acad4ca24c977cc4e058f1aa"
  upstream_license: "Curve copyright notice; upstream file says all rights reserved"
  checked_at: "2026-05-24"
  production_equivalence: false
  api_compatibility: "upstream Vyper source is exact; Solidity is a scoped fixed-2-coin port of the covered API"
  storage_layout_compatibility: false
  external_token_semantics: "harnessed_external_erc20_tokens"
  source_derivation: "Vyper implementation is vendored upstream source; Solidity implementation is an idiomatic fixed-2-coin port of the covered NG paths"
  equivalence_scope:
    - upstream Vyper constructor and external pool API for two-coin deployments
    - Vyper dynamic-array length behavior for add_liquidity, calc_token_amount, remove_liquidity, and remove_liquidity_imbalance
    - exchange and one-coin withdrawal signatures with receiver argument
    - exchange_received optimistic-transfer swaps for standard tokens
    - ERC20 tokens that return either bool or no data from transfer and transferFrom
    - imbalanced liquidity removal
    - admin amplification ramping, fee updates, moving-average window updates, and admin-fee withdrawal entrypoint
    - EIP-712 LP-token permit for EOA signatures and ERC1271 smart contract wallets
    - LP token accounting
    - deterministic standard-token dynamic-fee and admin-fee accounting
    - virtual price and observable balances
    - amplification, stored-rate, aggregate-balance, and one-coin withdrawal quote views
    - constructor-provided rate multipliers, rate oracles, rebasing asset flags, and ERC4626 rate scaling
    - NG-style gross stored_balances accounting with admin_balances excluded through balances views
  scenario_coverage:
    - add_initial_liquidity
    - add_initial_liquidity_after_donation
    - add_initial_liquidity_three_coin
    - add_initial_liquidity_eight_coin
    - get_dy_three_coin
    - calc_token_amount_eight_coin
    - exchange_three_coin
    - exchange_eight_coin_boundary
    - exchange_received_three_coin
    - remove_liquidity_three_coin
    - remove_liquidity_eight_coin
    - remove_one_coin_eight_coin
    - remove_liquidity_imbalance_eight_coin
    - remove_liquidity_imbalance_three_coin
    - calc_withdraw_one_coin_three_coin
    - remove_one_coin_three_coin
    - add_imbalanced_liquidity
    - add_liquidity_extra_amounts
    - add_liquidity_too_many_amounts_reverts
    - add_liquidity_slippage_reverts
    - add_liquidity_no_return_tokens
    - exchange_0_to_1
    - exchange_1_to_0
    - exchange_slippage_reverts
    - exchange_received_0_to_1
    - get_dy_quote
    - get_dx_quote
    - calc_token_amount_deposit
    - calc_token_amount_withdraw
    - calc_token_amount_extra_amounts
    - calc_token_amount_too_many_amounts_reverts
    - dynamic_fee_quote
    - price_oracle_after_time
    - d_oracle_after_time
    - price_oracle_three_coin_after_time
    - d_oracle_three_coin_after_time
    - remove_liquidity
    - remove_liquidity_no_return_tokens
    - remove_liquidity_extra_min_amounts_reverts
    - remove_liquidity_imbalance
    - remove_liquidity_imbalance_extra_amounts
    - remove_liquidity_imbalance_too_many_amounts_reverts
    - remove_liquidity_imbalance_slippage_reverts
    - remove_one_coin
    - calc_withdraw_one_coin
    - remove_one_coin_slippage_reverts
    - invalid_coin_reverts
    - ramp_a
    - ramp_a_too_soon_reverts
    - stop_ramp_a
    - set_new_fee
    - set_new_fee_non_admin_reverts
    - set_ma_exp_time
    - set_ma_exp_time_zero_reverts
    - withdraw_admin_fees
    - oracle_rate_exchange
    - rebasing_balance_exchange
    - rebasing_exchange_received_reverts
    - erc4626_rate_exchange
    - permit_valid
    - permit_erc1271_valid
    - permit_invalid_reverts
  mock_assumptions:
    - default benchmark scenarios deploy two standard 18-decimal ERC20 test coins with switchable optional return data
    - factory/admin/fee receiver hooks and the delegated NG views implementation are provided by the generated harness
    - oracle, rebasing, and ERC4626 coverage uses deterministic harness coins, rate oracles, and vault-share rates
    - Solidity port uses constructor-driven N_COINS for covered standard-token scenarios and is not a line-for-line NG translation
  included_features:
    - upstream Vyper pool source at the pinned commit
    - constructor-initialized two-coin pool setup
    - constructor-initialized three-coin pool setup
    - constructor-initialized eight-coin MAX_COINS boundary setup
    - factory-delegated three-coin quote views
    - factory-delegated eight-coin calc_token_amount quote at MAX_COINS
    - standard-token three-coin exchange path
    - standard-token three-coin exchange_received optimistic-transfer path
    - standard-token eight-coin endpoint exchange path
    - proportional three-coin liquidity removal
    - proportional eight-coin liquidity removal at MAX_COINS
    - eight-coin one-coin withdrawal at MAX_COINS
    - imbalanced eight-coin liquidity removal at MAX_COINS
    - imbalanced three-coin liquidity removal with dynamic fees
    - three-coin one-coin withdrawal and quote paths
    - first liquidity after pre-deposit token donation
    - balanced and imbalanced add liquidity
    - Vyper DynArray[MAX_COINS] amount bounds, including ignored extra entries for deposit, imbalanced-withdrawal, and quote paths
    - both exchange directions
    - exchange_received optimistic-transfer flow
    - factory-delegated NG quote views for get_dy, get_dx, calc_token_amount, and dynamic_fee
    - optional-return ERC20 transfer and transferFrom compatibility
    - proportional and one-coin withdrawal
    - amplification, stored-rate, aggregate-balance, and one-coin withdrawal quote views
    - imbalanced withdrawal
    - admin amplification ramp, stop-ramp, fee, moving-average, and admin-fee withdrawal controls
    - dynamic/off-peg fee and admin-fee accounting
    - upstream exponential moving-average oracle decay for price and D oracle reads after elapsed time
    - three-coin moving-average oracle decay across multiple price slots and D oracle reads
    - constructor-driven stored rates, oracle rates, rebasing balance reads, ERC4626 conversion rates, and the rebasing exchange_received rejection path
    - NG-style transfer-in, transfer-out, admin-fee, and oracle-upkeep accounting
    - valid EIP-712 LP permit acceptance for EOA signatures and ERC1271 smart contract wallets, plus invalid permit revert paths
    - normalized event/log parity across the listed differential scenarios
    - slippage and invalid coin reverts
  excluded_features:
    - exact storage layout compatibility in the Solidity port
    - exhaustive dynamic N-coin scenario coverage for every pool action at every N_COINS value
    - full upstream factory/views dependency behavior beyond deterministic benchmark fixtures
    - exhaustive revert-data and Vyper DynArray decoder-boundary parity audit outside the listed scenarios
semantics:
  - "Benchmarks upstream Curve Stableswap NG Vyper against a Solidity port over matched two-coin standard-token, oracle-rate, rebasing, and ERC4626 harness deployments."
  - "The Solidity port is scoped to a fixed 2-coin shape and should not be read as a line-for-line production Curve NG rewrite."
scenarios:
  - name: add_initial_liquidity
    call: "add_liquidity([1_000_000, 1_000_000], 0, address(this))"
    expected: "mints initial LP shares from D"
  - name: add_initial_liquidity_after_donation
    call: "add_liquidity([0.1e18, 0.1e18], 0, address(this)) after 10 wei of token0 is donated to the empty pool"
    expected: "matches upstream donation-before-first-deposit behavior and initializes stored balances without treating the dust as user input"
  - name: add_initial_liquidity_three_coin
    call: "add_liquidity([1_000_000, 1_000_000, 1_000_000], 0, address(this)) on a three-coin deployment"
    expected: "mints initial LP shares using constructor-driven N_COINS rather than fixed two-coin math"
  - name: add_initial_liquidity_eight_coin
    call: "add_liquidity([1_000_000 x 8], 0, address(this)) on an eight-coin deployment"
    expected: "mints initial LP shares at the upstream MAX_COINS boundary"
  - name: get_dy_three_coin
    call: "get_dy(0, 2, 25_000) after initial liquidity on a three-coin deployment"
    expected: "routes through the benchmark views implementation using constructor-driven N_COINS quote math"
  - name: exchange_three_coin
    call: "exchange(0, 2, 25_000, 0, address(this)) after initial liquidity on a three-coin deployment"
    expected: "updates all constructor-sized accounting and oracle slots after a non-two-coin swap"
  - name: exchange_eight_coin_boundary
    call: "exchange(0, 7, 25_000, 0, address(this)) after initial liquidity on an eight-coin deployment"
    expected: "updates endpoint coin balances, fees, and the final price oracle slot at the MAX_COINS boundary"
  - name: exchange_received_three_coin
    call: "exchange_received(0, 2, 25_000, 0, address(this)) after direct token transfer to a three-coin deployment"
    expected: "uses the optimistic incoming balance and updates constructor-sized accounting and oracle slots"
  - name: remove_liquidity_three_coin
    call: "remove_liquidity(10_000, [0, 0, 0], address(this)) after initial liquidity on a three-coin deployment"
    expected: "burns LP shares and transfers proportional balances for all constructor-sized coins"
  - name: remove_liquidity_eight_coin
    call: "remove_liquidity(10_000, [0 x 8], address(this)) after initial liquidity on an eight-coin deployment"
    expected: "burns LP shares and transfers proportional balances at the upstream MAX_COINS boundary"
  - name: remove_one_coin_eight_coin
    call: "remove_liquidity_one_coin(10_000, 7, 0, address(this)) after initial liquidity on an eight-coin deployment"
    expected: "burns LP shares for one endpoint coin at the upstream MAX_COINS boundary"
  - name: remove_liquidity_imbalance_eight_coin
    call: "remove_liquidity_imbalance([40_000, 10_000, 25_000, 5_000, 12_000, 8_000, 15_000, 20_000], 250_000, address(this)) after initial liquidity on an eight-coin deployment"
    expected: "burns the required LP amount and applies dynamic fees at the upstream MAX_COINS boundary"
  - name: remove_liquidity_imbalance_three_coin
    call: "remove_liquidity_imbalance([40_000, 10_000, 25_000], 100_000, address(this)) after initial liquidity on a three-coin deployment"
    expected: "burns the required LP amount and applies dynamic fees across all constructor-sized coins"
  - name: calc_withdraw_one_coin_three_coin
    call: "calc_withdraw_one_coin(10_000, 2) after initial liquidity on a three-coin deployment"
    expected: "quotes a single-coin withdrawal using constructor-driven N_COINS fee and invariant math"
  - name: remove_one_coin_three_coin
    call: "remove_liquidity_one_coin(10_000, 2, 0, address(this)) after initial liquidity on a three-coin deployment"
    expected: "burns LP shares and transfers the selected coin while updating constructor-sized fee and oracle accounting"
  - name: add_imbalanced_liquidity
    call: "add_liquidity([100_000, 300_000], 0, address(this)) after initial liquidity"
    expected: "mints proportional LP shares"
  - name: add_liquidity_extra_amounts
    call: "add_liquidity([100_000, 100_000, 777], 0, address(this))"
    expected: "accepts a DynArray longer than the 2 active coins and ignores extra entries"
  - name: add_liquidity_too_many_amounts_reverts
    call: "add_liquidity([100_000, 100_000, ... length 9], 0, address(this))"
    expected: "reverts at the Vyper DynArray[MAX_COINS] ABI bound"
  - name: add_liquidity_slippage_reverts
    call: "add_liquidity([1, 1], 10_000_000, address(this)) after initial liquidity"
    expected: "reverts"
  - name: add_liquidity_no_return_tokens
    call: "add_liquidity([100_000, 100_000], 0, address(this)) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transferFrom return data and mints LP shares"
  - name: exchange_0_to_1
    call: "exchange(0, 1, 25_000, 0, address(this))"
    expected: "moves along the invariant and charges fee"
  - name: exchange_1_to_0
    call: "exchange(1, 0, 25_000, 0, address(this))"
    expected: "moves along the invariant and charges fee in the opposite direction"
  - name: exchange_slippage_reverts
    call: "exchange(0, 1, 25_000, 1_000_000, address(this))"
    expected: "reverts"
  - name: exchange_received_0_to_1
    call: "exchange_received(0, 1, 25_000, 0, address(this)) after direct token transfer to the pool"
    expected: "uses the optimistic incoming token balance and swaps along the invariant"
  - name: get_dy_quote
    call: "get_dy(0, 1, 25_000) after initial liquidity"
    expected: "quotes output through the factory views implementation"
  - name: get_dx_quote
    call: "get_dx(0, 1, 20_000) after initial liquidity"
    expected: "quotes required input through the factory views implementation"
  - name: calc_token_amount_deposit
    call: "calc_token_amount([100_000, 300_000], true) after initial liquidity"
    expected: "quotes LP minted for an imbalanced deposit with NG dynamic fees"
  - name: calc_token_amount_withdraw
    call: "calc_token_amount([40_000, 10_000], false) after initial liquidity"
    expected: "quotes LP burned for an imbalanced withdrawal with NG dynamic fees"
  - name: calc_token_amount_extra_amounts
    call: "calc_token_amount([100_000, 300_000, 777], true) after initial liquidity"
    expected: "accepts an amount DynArray longer than the 2 active coins and ignores extra entries"
  - name: calc_token_amount_eight_coin
    call: "calc_token_amount([100_000, 300_000, 200_000, 50_000, 75_000, 125_000, 80_000, 60_000], true) after initial liquidity on an eight-coin deployment"
    expected: "quotes LP minted through the factory views implementation at the upstream MAX_COINS boundary"
  - name: calc_token_amount_too_many_amounts_reverts
    call: "calc_token_amount([100_000, 300_000, ... length 9], true) after initial liquidity"
    expected: "reverts at the Vyper DynArray[MAX_COINS] ABI bound"
  - name: dynamic_fee_quote
    call: "dynamic_fee(0, 1) after imbalanced liquidity"
    expected: "returns the off-peg dynamic fee through the factory views implementation"
  - name: price_oracle_after_time
    call: "price_oracle(0) after an exchange changes the spot price and time advances by one averaging window"
    expected: "returns the exponentially decayed NG price oracle value"
  - name: d_oracle_after_time
    call: "D_oracle() after imbalanced liquidity changes D and time advances by one averaging window"
    expected: "returns the exponentially decayed NG D oracle value"
  - name: price_oracle_three_coin_after_time
    call: "price_oracle(1) after a three-coin exchange changes the second spot price slot and time advances by one averaging window"
    expected: "returns the exponentially decayed NG price oracle value for a non-two-coin price slot"
  - name: d_oracle_three_coin_after_time
    call: "D_oracle() after three-coin imbalanced liquidity changes D and time advances by one averaging window"
    expected: "returns the exponentially decayed NG D oracle value for a non-two-coin deployment"
  - name: remove_liquidity
    call: "remove_liquidity(10_000, [0, 0], address(this))"
    expected: "burns LP shares for proportional coin balances"
  - name: remove_liquidity_no_return_tokens
    call: "remove_liquidity(10_000, [0, 0], address(this)) with ERC20 tokens that return no transfer data"
    expected: "accepts empty transfer return data and burns LP shares"
  - name: remove_liquidity_extra_min_amounts_reverts
    call: "remove_liquidity(10_000, [0, 0, 0], address(this))"
    expected: "reverts because upstream explicitly requires min_amounts length equal to N_COINS"
  - name: remove_liquidity_imbalance
    call: "remove_liquidity_imbalance([40_000, 10_000], 100_000, address(this))"
    expected: "burns the required LP amount and withdraws imbalanced coin amounts with fees"
  - name: remove_liquidity_imbalance_extra_amounts
    call: "remove_liquidity_imbalance([40_000, 10_000, 777], 100_000, address(this))"
    expected: "accepts an amount DynArray longer than the 2 active coins and ignores extra entries"
  - name: remove_liquidity_imbalance_too_many_amounts_reverts
    call: "remove_liquidity_imbalance([40_000, 10_000, ... length 9], 100_000, address(this))"
    expected: "reverts at the Vyper DynArray[MAX_COINS] ABI bound"
  - name: remove_liquidity_imbalance_slippage_reverts
    call: "remove_liquidity_imbalance([40_000, 10_000], 1, address(this))"
    expected: "reverts"
  - name: remove_one_coin
    call: "remove_liquidity_one_coin(10_000, 1, 0, address(this))"
    expected: "burns LP shares for one coin with fee"
  - name: calc_withdraw_one_coin
    call: "calc_withdraw_one_coin(10_000, 1) after initial liquidity"
    expected: "quotes one-coin withdrawal amount without mutating state"
  - name: remove_one_coin_slippage_reverts
    call: "remove_liquidity_one_coin(10_000, 1, 1_000_000, address(this))"
    expected: "reverts"
  - name: invalid_coin_reverts
    call: "exchange(0, 2, 1, 0, address(this))"
    expected: "reverts"
  - name: ramp_a
    call: "ramp_A(300, block.timestamp + MIN_RAMP_TIME) after the initial ramp delay"
    expected: "sets future amplification and ramp timestamps from the admin"
  - name: ramp_a_too_soon_reverts
    call: "ramp_A(300, block.timestamp + MIN_RAMP_TIME) before the initial ramp delay"
    expected: "reverts"
  - name: stop_ramp_a
    call: "stop_ramp_A() during an active amplification ramp"
    expected: "pins current amplification and clears the active ramp window"
  - name: set_new_fee
    call: "set_new_fee(5_000_000, 30_000_000_000)"
    expected: "updates swap fee and off-peg fee multiplier from the admin"
  - name: set_new_fee_non_admin_reverts
    call: "set_new_fee(5_000_000, 30_000_000_000) from a non-admin address"
    expected: "reverts"
  - name: set_ma_exp_time
    call: "set_ma_exp_time(1_000, 70_000)"
    expected: "updates both moving-average windows from the admin"
  - name: set_ma_exp_time_zero_reverts
    call: "set_ma_exp_time(0, 70_000)"
    expected: "reverts"
  - name: withdraw_admin_fees
    call: "withdraw_admin_fees() after an exchange accrues admin fees"
    expected: "executes the public admin-fee withdrawal entrypoint"
  - name: permit_valid
    call: "permit with a harness-signed EIP-712 digest"
    expected: "sets LP allowance and increments the owner's nonce"
  - name: permit_erc1271_valid
    call: "permit from a smart contract wallet whose isValidSignature returns the ERC1271 magic value for the EIP-712 digest"
    expected: "sets LP allowance and increments the contract owner's nonce"
  - name: permit_invalid_reverts
    call: "permit with a zero signature"
    expected: "reverts"
implementations:
  solidity: "benches/implementations/curve_stableswap_2coin/solidity/CurveStableSwap2CoinReal.sol"
  vyper: "benches/implementations/curve_stableswap_2coin/vyper/upstream/contracts/main/CurveStableSwapNG.vy"
