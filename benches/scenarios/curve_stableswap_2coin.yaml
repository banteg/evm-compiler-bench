benchmark_id: curve_stableswap_2coin
scenarios:
  - name: add_initial_liquidity
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    expect_success: true
    observers: &curve_observers
      - data: 'abi.encodeWithSignature("balances(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("balances(uint256)", uint256(1))'
      - data: 'abi.encodeWithSignature("admin_balances(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("admin_balances(uint256)", uint256(1))'
      - data: 'abi.encodeWithSignature("A()")'
      - data: 'abi.encodeWithSignature("A_precise()")'
      - data: 'abi.encodeWithSignature("initial_A()")'
      - data: 'abi.encodeWithSignature("future_A()")'
      - data: 'abi.encodeWithSignature("initial_A_time()")'
      - data: 'abi.encodeWithSignature("future_A_time()")'
      - data: 'abi.encodeWithSignature("fee()")'
      - data: 'abi.encodeWithSignature("admin_fee()")'
      - data: 'abi.encodeWithSignature("offpeg_fee_multiplier()")'
      - data: 'abi.encodeWithSignature("get_balances()")'
      - data: 'abi.encodeWithSignature("stored_rates()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("nonces(address)", benchCurvePermitOwner())'
      - data: 'abi.encodeWithSignature("allowance(address,address)", benchCurvePermitOwner(), BOB)'
      - data: 'abi.encodeWithSignature("get_virtual_price()")'
      - data: 'abi.encodeWithSignature("ma_exp_time()")'
      - data: 'abi.encodeWithSignature("D_ma_time()")'
      - data: 'abi.encodeWithSignature("ma_last_time()")'
      - data: 'abi.encodeWithSignature("last_price(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("ema_price(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("price_oracle(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("D_oracle()")'
  - name: add_initial_liquidity_after_donation
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveStageReceived(address,uint256,uint256)", {target}, uint256(0), uint256(10))'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(100_000_000_000_000_000, 100_000_000_000_000_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
