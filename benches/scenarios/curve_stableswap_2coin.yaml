benchmark_id: curve_stableswap_2coin
scenarios:
  - name: add_initial_liquidity
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    expect_success: true
    observers: &curve_observers
      - data: 'abi.encodeWithSignature("balances(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("balances(uint256)", uint256(1))'
      - data: 'abi.encodeWithSignature("admin_balances(uint256)", uint256(0))'
      - data: 'abi.encodeWithSignature("admin_balances(uint256)", uint256(1))'
      - data: 'abi.encodeWithSignature("A()")'
      - data: 'abi.encodeWithSignature("A_precise()")'
      - data: 'abi.encodeWithSignature("get_balances()")'
      - data: 'abi.encodeWithSignature("stored_rates()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("nonces(address)", benchCurvePermitOwner())'
      - data: 'abi.encodeWithSignature("allowance(address,address)", benchCurvePermitOwner(), BOB)'
      - data: 'abi.encodeWithSignature("get_virtual_price()")'
  - name: add_imbalanced_liquidity
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(100_000, 300_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: add_liquidity_slippage_reverts
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1, 1), uint256(10_000_000), address(this))'
    expect_success: false
    observers: *curve_observers
  - name: add_liquidity_no_return_tokens
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveSetReturnData(address,bool)", {target}, false)'
    measured:
      data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(100_000, 100_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: exchange_0_to_1
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    warmup:
      - data: 'abi.encodeWithSignature("get_virtual_price()")'
    measured:
      data: 'abi.encodeWithSignature("exchange(int128,int128,uint256,uint256,address)", int128(0), int128(1), uint256(25_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: exchange_1_to_0
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    warmup:
      - data: 'abi.encodeWithSignature("get_virtual_price()")'
    measured:
      data: 'abi.encodeWithSignature("exchange(int128,int128,uint256,uint256,address)", int128(1), int128(0), uint256(25_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: exchange_slippage_reverts
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("exchange(int128,int128,uint256,uint256,address)", int128(0), int128(1), uint256(25_000), uint256(1_000_000), address(this))'
    expect_success: false
    observers: *curve_observers
  - name: exchange_received_0_to_1
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveStageReceived(address,uint256,uint256)", {target}, uint256(0), uint256(25_000))'
    measured:
      data: 'abi.encodeWithSignature("exchange_received(int128,int128,uint256,uint256,address)", int128(0), int128(1), uint256(25_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: remove_liquidity
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("remove_liquidity(uint256,uint256[],address)", uint256(10_000), curveAmounts(0, 0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: remove_liquidity_no_return_tokens
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveSetReturnData(address,bool)", {target}, false)'
    measured:
      data: 'abi.encodeWithSignature("remove_liquidity(uint256,uint256[],address)", uint256(10_000), curveAmounts(0, 0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: remove_liquidity_imbalance
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("remove_liquidity_imbalance(uint256[],uint256,address)", curveAmounts(40_000, 10_000), uint256(100_000), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: remove_liquidity_imbalance_slippage_reverts
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    measured:
      data: 'abi.encodeWithSignature("remove_liquidity_imbalance(uint256[],uint256,address)", curveAmounts(40_000, 10_000), uint256(1), address(this))'
    expect_success: false
    observers: *curve_observers
  - name: remove_one_coin
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
