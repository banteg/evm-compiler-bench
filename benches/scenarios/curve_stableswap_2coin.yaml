  - name: permit_valid
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'benchCurvePermitCalldata({target}, BOB, uint256(123), block.timestamp + 100000)'
    expect_success: true
    observers: *curve_observers
  - name: permit_invalid_reverts
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'abi.encodeWithSignature("permit(address,address,uint256,uint256,uint8,bytes32,bytes32)", address(this), BOB, uint256(123), uint256(999999), uint8(27), bytes32(0), bytes32(0))'
    expect_success: false
    observers: *curve_observers
