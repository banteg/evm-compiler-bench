  - name: erc4626_rate_exchange
    deployment_variant: curve_erc4626
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
      - data: 'abi.encodeWithSignature("add_liquidity(uint256[],uint256,address)", curveAmounts(1_000_000, 1_000_000), uint256(0), address(this))'
    warmup:
      - data: 'abi.encodeWithSignature("stored_rates()")'
    measured:
      data: 'abi.encodeWithSignature("exchange(int128,int128,uint256,uint256,address)", int128(0), int128(1), uint256(25_000), uint256(0), address(this))'
    expect_success: true
    observers: *curve_observers
  - name: permit_valid
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'benchCurvePermitCalldata({target}, BOB, uint256(123), block.timestamp + 100000)'
    expect_success: true
    observers: *curve_observers
  - name: permit_erc1271_valid
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchCurveInit(address,uint256,uint256,uint256)", {target}, uint256(200), uint256(4_000_000), uint256(5_000_000_000))'
    measured:
      data: 'benchCurve1271PermitCalldata({target}, BOB, uint256(456), block.timestamp + 100000)'
    expect_success: true
    observers:
      - data: 'abi.encodeWithSignature("nonces(address)", benchCurve1271PermitOwner())'
      - data: 'abi.encodeWithSignature("allowance(address,address)", benchCurve1271PermitOwner(), BOB)'