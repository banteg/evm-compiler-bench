benchmark_id: uniswap_v2_factory
scenarios:
  - name: fee_to_getter
    state_access_profile: cold
    measured:
      data: 'abi.encodeWithSignature("feeTo()")'
    expect_success: true
    observers: &factory_observers
      - destination: harness
        data: 'abi.encodeWithSignature("benchUniswapFactoryStateHash(address,address,address)", {target}, BOB, CAROL)'
  - name: set_fee_to
    state_access_profile: warm
    measured:
      data: 'abi.encodeWithSignature("setFeeTo(address)", BOB)'
    expect_success: true
    observers: *factory_observers
  - name: set_fee_to_setter
    state_access_profile: warm
    measured:
      data: 'abi.encodeWithSignature("setFeeToSetter(address)", BOB)'
    expect_success: true
    observers: *factory_observers
  - name: create_pair
    state_access_profile: cold
    measured:
      data: 'abi.encodeWithSignature("createPair(address,address)", BOB, CAROL)'
    expect_success: true
    compare_return: false
    observers: &created_pair_observers
      - destination: harness
        data: 'abi.encodeWithSignature("benchUniswapFactoryStateHash(address,address,address)", {target}, BOB, CAROL)'
  - name: create_pair_reverse_order
    state_access_profile: cold
    measured:
      data: 'abi.encodeWithSignature("createPair(address,address)", CAROL, BOB)'
    expect_success: true
    compare_return: false
    observers: *created_pair_observers