benchmark_id: yearn_vault_v2
scenarios:
  - name: initialize
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnPrepare(address)", {target})'
    measured:
      data: 'abi.encodeWithSignature("initialize(address,address,address,string,string,address,address)", benchYearnAsset({target}), address(this), address(this), "Yearn V2 Vault", "yvV2", address(this), address(this))'
    expect_success: true
    observers: &yearn_v2_observers
      - data: 'abi.encodeWithSignature("name()")'
      - data: 'abi.encodeWithSignature("symbol()")'
      - data: 'abi.encodeWithSignature("apiVersion()")'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnAssetId(address)", {target})'
      - data: 'abi.encodeWithSignature("governance()")'
      - data: 'abi.encodeWithSignature("management()")'
      - data: 'abi.encodeWithSignature("guardian()")'
      - data: 'abi.encodeWithSignature("depositLimit()")'
      - data: 'abi.encodeWithSignature("debtRatio()")'
      - data: 'abi.encodeWithSignature("totalIdle()")'
      - data: 'abi.encodeWithSignature("totalDebt()")'
      - data: 'abi.encodeWithSignature("totalAssets()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("balanceOf(address)", BOB)'
      - data: 'abi.encodeWithSignature("allowance(address,address)", address(this), BOB)'
      - data: 'abi.encodeWithSignature("pricePerShare()")'
      - data: 'abi.encodeWithSignature("maxAvailableShares()")'
      - data: 'abi.encodeWithSignature("availableDepositLimit()")'
      - data: 'abi.encodeWithSignature("creditAvailable(address)", benchYearnStrategy({target}))'
      - data: 'abi.encodeWithSignature("debtOutstanding(address)", benchYearnStrategy({target}))'
      - data: 'abi.encodeWithSignature("expectedReturn(address)", benchYearnStrategy({target}))'
      - data: 'abi.encodeWithSignature("strategies(address)", benchYearnStrategy({target}))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnV2QueueIds(address)", {target})'
  - name: initialize_long_metadata
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnPrepare(address)", {target})'
    measured:
      data: 'abi.encodeWithSignature("initialize(address,address,address,string,string,address,address)", benchYearnAsset({target}), address(this), address(this), "Yearn Vault with a name crossing two storage words and a tail", "yvSymbol-at32-byte-word-boundary", address(this), address(this))'
    expect_success: true
    observers: *yearn_v2_observers
  - name: set_deposit_limit
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnV2Init(address,uint256,uint256)", {target}, uint256(1_000_000), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("setDepositLimit(uint256)", uint256(2_000_000))'
    expect_success: true
    observers: *yearn_v2_observers
  - name: deposit
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnV2Init(address,uint256,uint256)", {target}, uint256(1_000_000), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    expect_success: true
    observers: *yearn_v2_observers
  - name: deposit_all
    state_access_profile: mixed
