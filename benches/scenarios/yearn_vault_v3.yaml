benchmark_id: yearn_vault_v3
scenarios:
  - name: initialize
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnPrepare(address)", {target})'
    measured:
      data: 'abi.encodeWithSignature("initialize(address,string,string,address,uint256)", benchYearnAsset({target}), "Yearn V3 Vault", "yvV3", address(this), uint256(86400))'
    expect_success: true
    observers: &yearn_observers
      - data: 'abi.encodeWithSignature("name()")'
      - data: 'abi.encodeWithSignature("symbol()")'
      - data: 'abi.encodeWithSignature("apiVersion()")'
      - data: 'abi.encodeWithSignature("FACTORY()")'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnAssetId(address)", {target})'
      - data: 'abi.encodeWithSignature("decimals()")'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnAccountantId(address)", {target})'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnDepositLimitModuleId(address)", {target})'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnWithdrawLimitModuleId(address)", {target})'
      - data: 'abi.encodeWithSignature("deposit_limit()")'
      - data: 'abi.encodeWithSignature("minimum_total_idle()")'
      - data: 'abi.encodeWithSignature("use_default_queue()")'
      - data: 'abi.encodeWithSignature("auto_allocate()")'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnDefaultQueueIds(address)", {target})'
      - data: 'abi.encodeWithSignature("strategies(address)", benchYearnStrategy({target}))'
      - data: 'abi.encodeWithSignature("strategies(address)", benchYearnStrategy2({target}))'
      - data: 'abi.encodeWithSignature("role_manager()")'
      - data: 'abi.encodeWithSignature("future_role_manager()")'
      - data: 'abi.encodeWithSignature("roles(address)", address(this))'
      - data: 'abi.encodeWithSignature("roles(address)", BOB)'
      - data: 'abi.encodeWithSignature("isShutdown()")'
      - data: 'abi.encodeWithSignature("unlockedShares()")'
      - data: 'abi.encodeWithSignature("profitMaxUnlockTime()")'
      - data: 'abi.encodeWithSignature("fullProfitUnlockDate()")'
      - data: 'abi.encodeWithSignature("profitUnlockingRate()")'
      - data: 'abi.encodeWithSignature("lastProfitUpdate()")'
      - data: 'abi.encodeWithSignature("totalAssets()")'
      - data: 'abi.encodeWithSignature("totalIdle()")'
      - data: 'abi.encodeWithSignature("totalDebt()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("balanceOf(address)", BOB)'
      - data: 'abi.encodeWithSignature("pricePerShare()")'
      - data: 'abi.encodeWithSignature("convertToShares(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("previewDeposit(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("previewMint(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("convertToAssets(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("maxDeposit(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxMint(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxWithdraw(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxWithdraw(address,uint256)", address(this), uint256(10_000))'
      - data: 'abi.encodeWithSignature("maxRedeem(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxRedeem(address,uint256)", address(this), uint256(10_000))'
      - data: 'abi.encodeWithSignature("previewWithdraw(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("previewRedeem(uint256)", uint256(1_000))'
      - data: 'abi.encodeWithSignature("nonces(address)", address(this))'
      - data: 'abi.encodeWithSignature("nonces(address)", benchYearnPermitOwner())'
      - data: 'abi.encodeWithSignature("allowance(address,address)", benchYearnPermitOwner(), BOB)'
      - data: 'abi.encodeWithSignature("allowance(address,address)", address(this), BOB)'
