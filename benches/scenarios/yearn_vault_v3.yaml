benchmark_id: yearn_vault_v3
scenarios:
  - name: initialize
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnPrepare(address)", {target})'
    measured:
      data: 'abi.encodeWithSignature("initialize(address,string,string,address,uint256)", benchYearnAsset({target}), "Yearn V3 Vault", "yvV3", address(this), uint256(86400))'
    expect_success: true
    observers: &yearn_observers
      - data: 'abi.encodeWithSignature("totalAssets()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("balanceOf(address)", BOB)'
      - data: 'abi.encodeWithSignature("pricePerShare()")'
      - data: 'abi.encodeWithSignature("maxDeposit(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxWithdraw(address,uint256)", address(this), uint256(10_000))'
      - data: 'abi.encodeWithSignature("nonces(address)", address(this))'
      - data: 'abi.encodeWithSignature("nonces(address)", benchYearnPermitOwner())'
      - data: 'abi.encodeWithSignature("allowance(address,address)", benchYearnPermitOwner(), BOB)'
  - name: deposit
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    expect_success: true
    observers: *yearn_observers
  - name: mint
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("mint(uint256,address)", uint256(50_000), address(this))'
    expect_success: true
    observers: *yearn_observers
  - name: withdraw_idle
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    measured:
      data: 'abi.encodeWithSignature("withdraw(uint256,address,address,uint256)", uint256(20_000), address(this), address(this), uint256(0))'
    expect_success: true
    observers: *yearn_observers
  - name: redeem_idle
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    measured:
      data: 'abi.encodeWithSignature("redeem(uint256,address,address,uint256)", uint256(20_000), address(this), address(this), uint256(0))'
    expect_success: true
    observers: *yearn_observers
  - name: update_debt_increase
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", benchYearnStrategy({target}), uint256(150_000))'
    measured:
      data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(100_000), uint256(0))'
    expect_success: true
    observers: *yearn_observers
  - name: update_debt_decrease
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", benchYearnStrategy({target}), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(100_000), uint256(0))'
    measured:
      data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(40_000), uint256(0))'
    expect_success: true
    observers: *yearn_observers
  - name: strategy_profit_report
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", benchYearnStrategy({target}), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(100_000), uint256(0))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnSetReport(address,uint256,uint256)", {target}, uint256(10_000), uint256(0))'
    measured:
      data: 'abi.encodeWithSignature("process_report(address)", benchYearnStrategy({target}))'
    expect_success: true
    observers: *yearn_observers
  - name: profit_unlock_after_time
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(10), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", benchYearnStrategy({target}), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(100_000), uint256(0))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnSetReport(address,uint256,uint256)", {target}, uint256(10_000), uint256(0))'
      - data: 'abi.encodeWithSignature("process_report(address)", benchYearnStrategy({target}))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchWarp(uint256)", uint256(5))'
    measured:
      data: 'abi.encodeWithSignature("pricePerShare()")'
    expect_success: true
    observers: *yearn_observers
  - name: strategy_loss_withdraw
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", benchYearnStrategy({target}), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", benchYearnStrategy({target}), uint256(150_000), uint256(0))'
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnSetReport(address,uint256,uint256)", {target}, uint256(0), uint256(5_000))'
      - data: 'abi.encodeWithSignature("process_report(address)", benchYearnStrategy({target}))'
    measured:
      data: 'abi.encodeWithSignature("withdraw(uint256,address,address,uint256)", uint256(120_000), address(this), address(this), uint256(1_000))'
    expect_success: true
    observers: *yearn_observers
  - name: shutdown_rejects_deposit
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("shutdown_vault()")'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(1), address(this))'
    expect_success: false
    observers: *yearn_observers
  - name: permission_revert
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("add_strategy(address,bool)", benchYearnStrategy({target}), true)'
      sender: BOB
    expect_success: false
    observers: *yearn_observers
  - name: deposit_limit_reverts
    state_access_profile: warm
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(2_000), address(this))'
    expect_success: false
    observers: *yearn_observers
  - name: permit_valid
    state_access_profile: mixed
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'benchYearnPermitCalldata({target}, BOB, uint256(123), block.timestamp + 100000)'
    expect_success: true
    observers: *yearn_observers
  - name: permit_invalid_reverts
    state_access_profile: cold
    setup:
      - destination: harness
        data: 'abi.encodeWithSignature("benchYearnInit(address,uint256,uint256,uint256)", {target}, uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("permit(address,address,uint256,uint256,uint8,bytes32,bytes32)", address(this), BOB, uint256(123), uint256(999999), uint8(27), bytes32(0), bytes32(0))'
    expect_success: false
    observers: *yearn_observers
